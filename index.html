<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shawn’s Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b1420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,166vh);max-width:100%;display:block;image-rendering:pixelated;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c" width="320" height="192" aria-label="Pixel room"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const W=320,H=192,K='#3a2012',FONT='8px Silkscreen, monospace',NAV=true; // 点击真正跳转
if(document.fonts)document.fonts.load('8px Silkscreen');
let T=g;
const R=(x,y,w,h,f)=>{T.fillStyle=f;T.fillRect(x|0,y|0,w,h)};
const B=(x,y,w,h,f,hi,sh)=>{R(x-1,y-1,w+2,h+2,K);R(x,y,w,h,f);if(hi){R(x,y,w,1,hi);R(x,y,1,h,hi)}if(sh){R(x,y+h-1,w,1,sh);R(x+w-1,y,1,h,sh)}};

// ---- 昼夜：按真实时间 ----
const n=new Date(),hr=n.getHours()+n.getMinutes()/60;
const phase=(hr<6||hr>=20)?'night':(hr<8||hr>=18)?'dusk':'day';
const SKY={day:['#8fd8f8','#c4ecfa'],dusk:['#f08a5a','#f8c880'],night:['#142048','#26346a']}[phase];
const TINT={day:null,dusk:'rgba(255,120,60,.10)',night:'rgba(20,30,90,.28)'}[phase];

// ---- 静态背景（预渲染一次）----
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){
  T=bg.getContext('2d');const q=T;
  let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
  // 墙纸
  R(0,0,W,64,'#e2b982');for(let x=0;x<W;x+=8)R(x,0,1,44,'#d8ad76');
  for(let y=6;y<44;y+=12)for(let x=4;x<W;x+=16)R(x,y,2,2,'#d2a56e');
  R(0,0,W,3,'#a8683a');
  // 护墙板
  R(0,44,W,20,'#a8683a');R(0,44,W,2,'#d49a58');R(0,46,W,1,K);
  for(let x=4;x<W;x+=24){R(x,49,20,12,'#9a5c30');R(x,49,20,1,'#7d4624');R(x,60,20,1,'#c98a4a')}
  R(0,62,W,3,K);R(0,62,W,2,'#6d3c1c');
  // 木地板
  for(let r=0;r<16;r++){const y=65+r*8;R(0,y,W,8,r%2?'#bd7f45':'#c58a4e');R(0,y,W,1,'#d9a064');R(0,y+7,W,1,'#8d5530');
    for(let x=(r*37)%40;x<W;x+=40)R(x,y,1,8,'#8d5530')}
  for(let i=0;i<240;i++)R(rnd()*W,65+rnd()*127,2,1,'#a86c3a');
  // 窗户
  const wx=136,wy=8;B(wx,wy,48,34,'#7a4a24','#a8683a');q.clearRect(wx+3,wy+3,42,26);
  R(wx+23,wy+3,2,26,'#7a4a24');R(wx+3,wy+15,42,2,'#7a4a24');
  B(wx-3,wy+34,54,4,'#c98a4a','#e6b070');R(wx-8,wy-3,64,2,'#5a3a1e');
  B(wx-6,wy,9,32,'#b84a44','#d86a60','#8a2e2e');B(wx+45,wy,9,32,'#b84a44','#d86a60','#8a2e2e');
  // 画
  B(22,14,26,20,'#7a4a24','#a8683a');R(24,16,22,16,'#8fd3f4');R(24,26,22,6,'#6fa84f');R(38,18,4,4,'#f6d860');R(28,24,8,3,'#fff');
  // 便利贴（墙上，可点击去 Message）
  B(116,16,12,12,'#f8e0a4','#fff2c8','#e0b86e');R(118,20,8,1,'#c8a060');R(118,23,8,1,'#c8a060');R(118,26,5,1,'#c8a060');R(121,15,2,2,'#e86a60');
  // 书架
  B(70,14,40,48,'#8a5228','#b57a42','#5e3418');
  const cols=['#b84a44','#3f7fb8','#5aa04a','#d6a840','#8e5ab8'];
  [28,42,60].forEach((b,j)=>{R(72,b,36,2,'#5e3418');for(let i=0;i<8;i++){const h=8+((i*5+j*3)%5);R(73+i*4,b-h,3,h,cols[(i+j)%5]);R(73+i*4,b-h,3,1,'#fff4')}});
  // 书桌
  B(204,56,92,8,'#c98a4a','#e6b070');B(204,64,92,14,'#a8683a','#c98a4a','#7d4624');
  B(210,67,24,8,'#8a5228','#a8683a');R(220,70,4,2,'#e6c07a');B(266,67,24,8,'#8a5228','#a8683a');R(276,70,4,2,'#e6c07a');
  B(206,78,5,16,'#7d4624');B(289,78,5,16,'#7d4624');
  B(244,50,10,6,'#6a6a6a');B(230,28,38,24,'#d8d0c0','#fff','#9a9080');B(236,58,28,4,'#e8e0d0','#fff','#bdb39c');B(278,50,6,6,'#f4f4f4','#fff','#bbb');R(284,52,2,3,K);
  // 椅子靠背
  B(240,82,24,20,'#b84a44','#d86a60','#8a2e2e');B(240,102,24,4,'#8a2e2e');
  // 床
  B(6,76,58,36,'#7a4a24','#a8683a','#5e3418');B(3,71,9,46,'#6d3c1c','#8a5228','#4a2810');
  B(13,79,48,30,'#f0e8d8','#fff','#cfc4ac');B(15,83,13,14,'#fff8e8','#fff','#d4c8b0');
  B(29,94,32,15,'#4a86c8','#6aa6e0','#2e5e96');R(29,98,32,2,'#e8e0d0');
  // 边桌
  B(82,76,26,5,'#c98a4a','#e6b070');B(87,81,16,12,'#a8683a','#c98a4a','#7d4624');B(84,93,22,3,'#7d4624');
  // 地毯
  B(110,150,100,34,'#9a3f4a');R(114,154,92,26,'#c25a62');R(118,158,84,18,'#e8b878');R(120,160,80,14,'#c25a62');
  for(let x=126;x<196;x+=14)R(x,165,4,4,'#e8b878');
  // 沙发
  B(118,112,80,16,'#4f8a74','#6aa890','#356a56');B(122,126,72,18,'#5aa086','#78c0a4','#3e7c66');
  B(112,118,10,28,'#4a8068','#68a088','#306450');B(194,118,10,28,'#4a8068','#68a088','#306450');R(158,128,1,15,'#3e7c66');R(118,147,4,3,K);R(198,147,4,3,K);
  // 盆栽
  B(284,160,14,14,'#c0703a','#e09050','#8a4a22');B(282,142,18,18,'#3f9a4f','#62c06a','#2a7038');R(288,136,5,8,'#3f9a4f');R(286,150,2,4,'#62c06a');R(294,148,2,4,'#2a7038');
  // 窗光
  q.fillStyle='rgba(255,240,180,.13)';q.beginPath();q.moveTo(139,66);q.lineTo(181,66);q.lineTo(214,150);q.lineTo(168,150);q.fill();
  T=g;
})();

// ---- 状态 ----
const spots=[
  {x:252,y:104,pose:'sit',dir:'up',dur:300},
  {x:22,y:94,pose:'lie',dur:320},
  {x:158,y:141,pose:'sit',dir:'down',dur:300},
  {x:96,y:100,pose:'stand',dir:'up',dur:160}
];
const hot=[
  {x:228,y:26,w:42,h:28,label:'Projects',url:'/projects'},
  {x:86,y:62,w:20,h:16,label:'Blog',url:'/blog'},
  {x:114,y:14,w:16,h:16,label:'Message',url:'/message'},
  {x:22,y:14,w:26,h:20,label:'Mood',url:'/mood'}
];
const ch={x:150,y:104,pose:'stand',dir:'down',path:[],timer:50,t:0,last:-1,spot:null};
let hover=null,toast='',toastT=0;
const SF=spots[2];
function route(f,t){
  const p=[];
  if(f===SF)p.push([158,152],[104,152],[104,104]);
  p.push([150,104]);
  if(t===SF)p.push([104,104],[104,152],[158,152]);
  p.push([t.x,t.y]);return p;
}
function pick(){let i;do{i=Math.random()*spots.length|0}while(i===ch.last);
  ch.path=route(spots[ch.last],spots[i]);ch.spot=spots[i];ch.last=i}
function update(){
  ch.t++;
  if(!ch.path.length){if(--ch.timer<=0)pick();return}
  const p=ch.path[0],dx=p[0]-ch.x,dy=p[1]-ch.y,d=Math.hypot(dx,dy);
  if(d<1){ch.x=p[0];ch.y=p[1];ch.path.shift();
    if(!ch.path.length){const s=ch.spot;ch.pose=s.pose;ch.dir=s.dir||'down';ch.timer=s.dur+(Math.random()*120|0)}}
  else{ch.x+=dx/d*.7;ch.y+=dy/d*.7;ch.pose='walk';ch.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
}

// ---- 绘制 ----
function sky(){
  g.save();g.beginPath();g.rect(139,11,42,26);g.clip();
  R(139,11,42,13,SKY[0]);R(139,24,42,13,SKY[1]);
  if(phase==='night')[[142,14],[150,19],[160,13],[171,18],[176,26]].forEach(a=>R(a[0],a[1],1,1,'#fff'));
  else{const cx=139+((ch.t*.04)%62)-14;R(cx,17,12,4,'#fff');R(cx+3,15,8,3,'#fff')}
  R(139,31,42,6,'#4f9440');R(146,29,14,3,'#4f9440');R(166,29,10,3,'#4f9440');
  g.restore();
}
function screen(){
  R(233,31,32,18,'#14263a');
  const L=['#6fd0ff','#f4d58d','#9be28a'],o=ch.t/40|0;
  for(let i=0;i<5;i++)R(235,33+i*3,6+((i+o)*7)%18,1,L[i%3]);
  if((ch.t>>4)%2)R(235,48,2,1,'#fff');
  if(hover===hot[0])R(233,31,32,18,'rgba(255,255,255,.12)');
}
function book(){const dy=hover===hot[1]?-2:0;B(90,69+dy,14,7,'#3f9a5a','#6ac080','#2a6a3a');R(91,75+dy,12,1,'#f8f0d8');R(92,71+dy,6,1,'#f4d58d')}
function cat(){
  const br=Math.sin(ch.t*.05)>0?1:0;
  B(147,163-br,16,7+br,'#e8964a','#f4b070','#b86a28');B(142,165,7,6,'#e8964a','#f4b070','#b86a28');
  R(143,163,2,2,'#e8964a');R(147,163,2,2,'#e8964a');R(143,168,1,1,K);R(146,168,1,1,K);
  R(163,167,5,2,'#e8964a');R(167,165,2,3,'#e8964a');
  g.font=FONT;g.textBaseline='top';g.fillStyle='rgba(255,255,255,'+(.4+.4*Math.sin(ch.t*.04))+')';g.fillText('z',152,152-((ch.t>>4)%3));
}
function person(){
  const{x,y,pose,dir}=ch,wk=pose==='walk',st=wk?((ch.t>>3)%2):0,o=wk&&st?-1:0;
  if(pose==='lie'){
    R(14,85,14,13,K);R(15,86,12,4,'#6b3a1c');R(16,90,10,7,'#f6c8a0');R(18,92,2,1,K);R(22,92,2,1,K);R(17,94,2,1,'#f09080');R(23,94,2,1,'#f09080');
    const br=(ch.t>>5)%2;B(29,92-br,32,17+br,'#5a96d8','#7ab6f0','#2e5e96');R(29,98,32,2,'#e8e0d0');
    g.font=FONT;g.textBaseline='top';g.fillStyle='rgba(255,255,255,.7)';g.fillText('z',34,80-((ch.t>>4)%4));return;
  }
  R(x-6,y-1,12,3,'rgba(0,0,0,.22)');
  const sit=pose==='sit';g.save();if(sit)g.translate(0,3);
  const hair='#6b3a1c',sk='#f6c8a0',sh='#4a9ac8',sw=wk?(st?1:-1):0;
  R(x-7,y-24+o,14,14,K);R(x-6,y-13+o,12,13,K);
  R(x-6,y-23+o,12,5,hair);
  if(dir==='up')R(x-6,y-23+o,12,11,hair);
  else if(dir==='down'){R(x-6,y-18+o,2,4,hair);R(x+4,y-18+o,2,4,hair);R(x-4,y-18+o,8,6,sk);R(x-3,y-16+o,1,2,K);R(x+2,y-16+o,1,2,K);R(x-4,y-14+o,2,1,'#f09080');R(x+2,y-14+o,2,1,'#f09080')}
  else{const s=dir==='right'?1:-1;R(s>0?x-6:x+2,y-18+o,4,6,hair);R(s>0?x-2:x-5,y-18+o,7,6,sk);R(x+(s>0?2:-3),y-16+o,1,2,K);R(x+(s>0?3:-4),y-14+o,2,1,'#f09080')}
  R(x-5,y-12+o,10,7,sh);R(x-5,y-9+o,10,1,'#7ac0e8');
  R(x-6,y-11+o+sw,2,6,sh);R(x+4,y-11+o-sw,2,6,sh);R(x-6,y-5+o+sw,2,2,sk);R(x+4,y-5+o-sw,2,2,sk);
  if(!(sit&&dir==='up')){
    R(x-4,y-5,8,3,'#3a4a8a');
    if(sit){R(x-5,y-3,4,2,'#5a3418');R(x+1,y-3,4,2,'#5a3418')}
    else{R(x-4,y-2+(st?-1:0),3,2,'#5a3418');R(x+1,y-2+(st?0:-1),3,2,'#5a3418')}
  }
  g.restore();
}
function fx(){
  if(hover){
    const h=hover,p=(ch.t>>3)%2;
    g.strokeStyle=p?'#fff7c0':'#f4d58d';g.lineWidth=1;g.strokeRect(h.x+.5,h.y+.5,h.w,h.h);
    g.font=FONT;g.textBaseline='top';
    const tw=Math.ceil(g.measureText(h.label).width),bw=tw+12,bh=14,cx=h.x+h.w/2,
      bx=Math.min(Math.max(cx-bw/2|0,3),W-bw-3),by=Math.max(h.y-bh-6,3);
    R(bx-1,by,bw+2,bh,'#5b2e12');R(bx,by-1,bw,bh+2,'#5b2e12');R(bx,by,bw,bh,'#f8e0a4');R(bx+1,by+1,bw-2,1,'#fff2c8');R(bx+1,by+bh-2,bw-2,1,'#e0b86e');
    R(cx-3,by+bh+1,7,1,'#5b2e12');R(cx-2,by+bh+2,5,1,'#5b2e12');R(cx-1,by+bh+3,3,1,'#5b2e12');R(cx-2,by+bh,5,1,'#f8e0a4');R(cx-1,by+bh+1,3,1,'#f8e0a4');
    g.fillStyle='#5b2e12';g.fillText(h.label,bx+6,by+3);
  }else{
    [[262,22,0],[102,59,2]].forEach(a=>{if(Math.sin(ch.t*.06+a[2])>.7){R(a[0],a[1]-2,1,5,'#fff7c0');R(a[0]-2,a[1],5,1,'#fff7c0')}});
  }
  if(toastT>0){toastT--;g.font=FONT;g.textBaseline='top';const tw=Math.ceil(g.measureText(toast).width),bx=(W-tw)/2-6|0;
    R(bx-1,176,tw+14,15,'#5b2e12');R(bx,177,tw+12,13,'#f8e0a4');g.fillStyle='#5b2e12';g.fillText(toast,bx+6,180)}
}
const vg=g.createRadialGradient(160,96,80,160,96,215);vg.addColorStop(0,'rgba(40,10,0,0)');vg.addColorStop(1,'rgba(40,10,0,.38)');
function loop(){
  update();sky();g.drawImage(bg,0,0);screen();book();cat();person();
  if(TINT)R(0,0,W,H,TINT);
  g.fillStyle=vg;g.fillRect(0,0,W,H);fx();
  requestAnimationFrame(loop);
}

function at(e){
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
  return hot.find(h=>px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h)||null;
}
c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;hover=at(e);c.style.cursor=hover?'pointer':'default'});
c.addEventListener('pointerleave',()=>{hover=null});
c.addEventListener('pointerdown',e=>{
  const h=at(e);
  if(e.pointerType==='touch'&&h!==hover){hover=h;return} // 手机：先点一次显示提示，再点一次跳转
  if(!h)return;
  if(NAV){location.href=h.url}else{toast='Go to '+h.url;toastT=120}
});
loop();
</script>
</body>
</html>
